name: Trigger MyWorks Deployment

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  dispatch-myworks:
    name: Dispatch MyWorks Cloudflare Workers deployment
    runs-on: ubuntu-latest
    steps:
      - name: Trigger WeZZard/MyWorks deploy.yml
        env:
          DISPATCH_TOKEN: ${{ secrets.MYWORKS_DISPATCH_TOKEN || secrets.GH_PAT }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "Skipping dispatch: neither MYWORKS_DISPATCH_TOKEN nor GH_PAT is set in this repository."
            exit 0
          fi
          curl -fsSL \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/WeZZard/MyWorks/actions/workflows/deploy.yml/dispatches \
            -d '{"ref":"main"}'
